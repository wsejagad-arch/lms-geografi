<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Lokal · Ollama</title>
<style>
  :root { color-scheme: light dark; --line: #d8d8d8; --muted: #6b7280; --accent: #1f6feb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header b { font-size: 13px; letter-spacing: .02em; }
  select, button, textarea, input { font: inherit; color: inherit; }
  select, button { padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: transparent; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:disabled { opacity: .55; cursor: not-allowed; }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); }
  main { flex: 1; overflow-y: auto; padding: 18px 14px; }
  .row { max-width: 820px; margin: 0 auto 14px; display: flex; gap: 10px; }
  .row.user { flex-direction: row-reverse; }
  .who { flex: 0 0 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; border: 1px solid var(--line); }
  .bubble { padding: 9px 13px; border-radius: 10px; border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; max-width: calc(100% - 44px); }
  .row.user .bubble { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .bubble code { font: 12px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; }
  .bubble pre { background: color-mix(in srgb, currentColor 8%, transparent); padding: 9px 11px; border-radius: 8px; overflow-x: auto; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  footer { border-top: 1px solid var(--line); padding: 10px 14px; }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; min-height: 44px; max-height: 180px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; }
  .hint { max-width: 820px; margin: 6px auto 0; font-size: 11px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <b>Chat Lokal (Ollama)</b>
  <select id="model" aria-label="Model"></select>
  <select id="temp" aria-label="Kreativitas">
    <option value="0">presisi (0.0)</option>
    <option value="0.3" selected>seimbang (0.3)</option>
    <option value="0.7">kreatif (0.7)</option>
  </select>
  <button id="reset" type="button">Percakapan baru</button>
  <span id="status">menghubungkan…</span>
</header>

<main id="log"></main>

<footer>
  <div class="composer">
    <textarea id="input" placeholder="Tulis pesan… (Enter kirim, Shift+Enter baris baru)"></textarea>
    <button id="send" class="primary" type="button">Kirim</button>
  </div>
  <div class="hint">
    <span>Semua berjalan lokal di mesin ini.</span>
    <span id="endpoint"></span>
    <span id="speed"></span>
  </div>
</footer>

<script>
const $log = document.getElementById('log');
const $input = document.getElementById('input');
const $send = document.getElementById('send');
const $model = document.getElementById('model');
const $temp = document.getElementById('temp');
const $status = document.getElementById('status');
const $endpoint = document.getElementById('endpoint');
const $speed = document.getElementById('speed');

let history = [];
let busy = false;

function setStatus(text, bad = false) {
  $status.textContent = text;
  $status.style.color = bad ? '#c0392b' : '';
}

function fmtSize(bytes) {
  if (!bytes) return '';
  return (bytes / 1024 ** 3).toFixed(1) + ' GB';
}

async function loadModels() {
  try {
    const info = await (await fetch('/api/info')).json();
    $endpoint.textContent = info.base;
    $model.innerHTML = '';
    for (const m of info.models) {
      const opt = document.createElement('option');
      opt.value = m.name;
      opt.textContent = m.name + (m.size ? ' · ' + fmtSize(m.size) : '');
      $model.append(opt);
    }
    const preferred = info.models.find((m) => m.name === 'qwen2.5-coder:3b');
    if (preferred) $model.value = preferred.name;
    if (!info.models.length) {
      setStatus(info.error ? 'Ollama tidak terjangkau' : 'Tidak ada model', true);
    } else {
      setStatus('siap');
    }
  } catch (err) {
    setStatus('gagal memuat model: ' + err.message, true);
  }
}

function addRow(role, text) {
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = role === 'user' ? 'Anda' : 'AI';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  const wrap = document.createElement('div');
  wrap.style.maxWidth = 'calc(100% - 44px)';
  wrap.append(bubble);
  row.append(who, wrap);
  $log.append(row);
  $log.scrollTop = $log.scrollHeight;
  return bubble;
}

// Render sederhana: fenced code block + inline code + bold.
function render(el, raw) {
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  let html = '';
  const parts = raw.split(/```/);
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      const nl = part.indexOf('\n');
      const body = nl >= 0 ? part.slice(nl + 1) : part;
      html += '<pre><code>' + esc(body.replace(/\n$/, '')) + '</code></pre>';
    } else {
      html += esc(part)
        .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }
  });
  el.innerHTML = html;
  $log.scrollTop = $log.scrollHeight;
}

async function send() {
  const text = $input.value.trim();
  if (!text || busy) return;
  busy = true;
  $send.disabled = true;
  $input.value = '';

  history.push({ role: 'user', content: text });
  addRow('user', text);
  const bubble = addRow('assistant', '');
  const meta = document.createElement('div');
  meta.className = 'meta';
  bubble.after(meta);

  let acc = '';
  const started = performance.now();
  let tokens = 0;
  setStatus('berpikir…');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        model: $model.value,
        messages: [{ role: 'system', content: 'Jawab ringkas dalam bahasa Indonesia. Sertakan kode bila relevan.' }, ...history],
        temperature: Number($temp.value),
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: 'HTTP ' + res.status }));
      throw new Error(err.error || 'Gagal');
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (!line) continue;
        let obj;
        try { obj = JSON.parse(line); } catch { continue; }
        if (obj.message?.content) {
          acc += obj.message.content;
          render(bubble, acc);
        }
        if (obj.eval_count) tokens = obj.eval_count;
      }
    }
    if (!acc) render(bubble, '(kosong)');
    history.push({ role: 'assistant', content: acc });

    const secs = (performance.now() - started) / 1000;
    meta.textContent = `${$model.value} · ${secs.toFixed(1)} s` + (tokens ? ` · ${tokens} tok · ${(tokens / secs).toFixed(1)} tok/s` : '');
    setStatus('siap');
  } catch (err) {
    render(bubble, 'Gagal: ' + err.message);
    setStatus(err.message, true);
  } finally {
    busy = false;
    $send.disabled = false;
    $input.focus();
  }
}

$send.addEventListener('click', send);
$input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('reset').addEventListener('click', () => {
  history = [];
  $log.innerHTML = '';
  $speed.textContent = '';
  setStatus('siap');
  $input.focus();
});

loadModels().then(() => $input.focus());
</script>
</body>
</html>
