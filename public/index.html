<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0969da">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GeoEdulabs">
  <title>Login - LMS Geografi Multi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

  <div class="login-page">
    <div class="bg-shape shape-1" aria-hidden="true"></div>
    <div class="bg-shape shape-2" aria-hidden="true"></div>
    <div class="bg-shape shape-3" aria-hidden="true"></div>

    <div class="login-card">
      <div class="login-header">
      <div class="login-logo">🌍</div>
      <div class="login-title"><span class="brand-prefix">SELAMAT DATANG DI</span><span class="brand-name">GEO EDULABS</span></div>
      <div class="login-subtitle">Platform Pembelajaran Geografi interaktif dan Menyenangkan</div>
      </div>

      <div id="auth-error" class="auth-error" style="display:none"></div>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrap has-icon-right">
            <input type="text" id="email" placeholder="email atau NIS" required autocomplete="username">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap has-toggle">
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-pw" aria-label="Tampilkan password" id="toggle-pw">
              <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" style="display:none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-block">Masuk</button>
      </form>

      <div class="login-footer">
        <a href="https://github.com/nousresearch/hermes-agent" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </div>

  <script src="assets/js/sanitize.js?v=20261105"></script>
  <script src="assets/js/api.js?v=20261105"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const user = await LMS.checkAuth();
        if (user?.role === 'super_admin' || user?.role === 'admin') {
          window.location.href = '/admin.html';
        } else if (user?.role === 'student') {
          window.location.href = '/student.html';
        }
      } catch {}

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('auth-error');
        errEl.style.display = 'none';
        try {
          const ident = document.getElementById('email').value.trim();
          const pass = document.getElementById('password').value;
          let u;
          try {
            u = await LMS.login(ident, pass);
          } catch (e) {
            // Siswa login memakai NIS/username, bukan email
            u = await LMS.studentLogin(ident, pass);
          }
          if (u.role === 'super_admin' || u.role === 'admin') {
            window.location.href = '/admin.html';
          } else if (u.role === 'student') {
            window.location.href = '/student.html';
          } else {
            errEl.textContent = 'Role tidak dikenali';
            errEl.style.display = 'block';
          }
        } catch (err) {
          errEl.textContent = err.message || 'Login gagal';
          errEl.style.display = 'block';
        }
      });

      const toggleBtn = document.getElementById('toggle-pw');
      const passwordInput = document.getElementById('password');
      const eyeOn = toggleBtn.querySelector('.icon-eye');
      const eyeOff = toggleBtn.querySelector('.icon-eye-off');
      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          toggleBtn.setAttribute('aria-label', isPassword ? 'Sembunyikan password' : 'Tampilkan password');
          if (eyeOn && eyeOff) {
            eyeOn.style.display = isPassword ? 'none' : 'block';
            eyeOff.style.display = isPassword ? 'block' : 'none';
          }
        });
      }
    });
  </script>
</body>
</html>
